<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coding Club</title><style>
    /* CSS variables: colours and spacing */
    :root {
        --brand: #2f5bea;
        --light: #eef2ff;
        --dark: #1b2440;
        --gap: 16px;
    }

    /* Universal selector */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        background: var(--light);
        color: var(--dark);
        line-height: 1.6;
        padding: var(--gap);
    }

    /* Element selector */
    h1 {
        font-size: 2.2rem;
        letter-spacing: 1px;
    }

    /* ID selector */
    #hero {
        background: var(--brand);
        color: white;
        text-align: center;
        padding: 32px var(--gap);
        border-radius: 10px;
    }

    /* Class selector */
    .card {
        background: white;
        padding: var(--gap);
        margin-top: var(--gap);
        border-radius: 10px;
        box-shadow: 0 2px 8px #00000015;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 8px;
    }

    th {
        background: var(--brand);
        color: white;
        text-align: left;
    }

    th, td {
        padding: 10px;
        border-bottom: 1px solid #ccd;
    }

    input, select, textarea {
        padding: 8px;
        margin: 4px 0;
        max-width: 100%;
    }

    button {
        background: var(--brand);
        color: white;
        border: 0;
        padding: 10px 18px;
        border-radius: 6px;
        font-size: 1rem;
        cursor: pointer;
    }

    button:hover {
        background: #193db5;
    }

    footer {
        text-align: center;
        margin-top: var(--gap);
        padding: var(--gap);
    }
</style>

</head><body><header id="hero">
    <h1>Coding Club</h1>
    <p>Learn. Build. Share.</p>
</header>

<section class="card">
    <h2>Upcoming Events</h2>

    <table>
        <tr>
            <th>Event</th>
            <th>Date</th>
            <th>Venue</th>
        </tr>

        <tr>
            <td>HTML Workshop</td>
            <td>12 Nov</td>
            <td>Lab 1</td>
        </tr>

        <tr>
            <td>Hackathon</td>
            <td>20 Nov</td>
            <td>Seminar Hall</td>
        </tr>
    </table>
</section>

<section class="card">
    <h2>Register for the Club</h2>

    <form>
        <p>
            <label for="name">Name:</label><br>
            <input type="text" id="name" placeholder="Your name">
        </p>

        <p>
            <label for="email">Email:</label><br>
            <input type="email" id="email" placeholder="you@example.com">
        </p>

        <p>
            <label for="interest">Choose your interest:</label><br>
            <select id="interest">
                <option>Web Development</option>
                <option>Java Programming</option>
                <option>DSA</option>
            </select>
        </p>

        <button type="button">Register</button>
    </form>
</section>

<footer>
    <p>Created by Rinjham | Web Development Assignment</p>
</footer>

</body>
</html>
